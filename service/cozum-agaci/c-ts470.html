/* PATH */
function path(a){
  if(!a||!a.length)return'';
  return'<div class="pr">'+a.map((p,i)=>`<span class="pc">${p}</span>${i<a.length-1?'<span class="pa">›</span>':''}`).join('')+'</div>';
}
/* TABLO */
function tbl(f){
  if(!f||!f.length)return'';
  const rows=f.map(([a,b])=>{if(a.startsWith('──'))return`<tr class="fvt-sec"><td colspan="2">${a}</td></tr>`;return`<tr><td>${a}</td><td class="cpy" onclick="copyVal(this)" data-cpy="${cpyAttr(b)}">${b}</td></tr>`;}).join('');
  return`<div class="fvt-wrap"><table class="fvt"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* ADIMLAR (§ grup + JS numaralandırma) */
function steps(s){
  if(!s||!s.length)return'';
  var n=0;
  return'<ol class="sl">'+s.map(x=>{if(typeof x==='string'&&x.charAt(0)==='§'){n=0;return`<li class="sgrp"><span class="stx">${x.slice(1)}</span></li>`;}n++;return`<li><span class="snum">${n}</span><span class="stx">${x}</span></li>`;}).join('')+'</ol>';
}
/* TASK accordion (alt-görev) */
function task(t){
  const body=path(t.path)+
    (t.warn?`<div class="box warn"><span class="bi">⚠</span><div>${t.warn}</div></div>`:'')+
    (t.info?`<div class="box info"><span class="bi">ℹ</span><div>${t.info}</div></div>`:'')+
    tbl(t.fields)+steps(t.steps)+
    (t.result?`<div class="box result"><span class="bi">✓</span><div>${t.result}</div></div>`:'');
  return`<div class="task"><div class="thdiv" onclick="togTask(this)"><span class="tn">${t.num}</span><span class="tt">${t.title}</span>${t.app?`<span class="ab cpy" onclick="event.stopPropagation();copyVal(this)" data-cpy="${cpyAttr(t.app)}">${t.app}</span>`:''}<span class="task-chev">›</span></div><div class="task-body">${body}</div></div>`;
}
/* TASK üst grup */
function unit(u){
  const uid=`u${u.unit}`;
  const colors={1:'#06b6d4',2:'#a855f7',3:'#60a5fa',4:'#f59e0b',5:'#22c55e',6:'#ef4444',7:'#fbbf24',8:'#34d399',9:'#818cf8'};
  const c=colors[u.unit]||'#60a5fa';
  let h=`<div class="ug collapsed ${uid}" id="${uid}"><div class="uh" onclick="togUnit(this)"><span class="ubadge" style="border-color:${c}30;color:${c};background:${c}18">Task ${u.unit}</span><span class="utitle">${u.title}</span><span class="uc">${u.tasks.length} soru</span><span class="uchev">›</span></div><div class="ug-body">`;
  if(u.sc)h+=`<div class="scenario">${u.sc}</div>`;
  u.tasks.forEach(t=>h+=task(t));
  return h+'</div></div>';
}
function togUnit(uh){uh.closest('.ug').classList.toggle('collapsed');}
function togTask(hd){hd.parentElement.classList.toggle('open');}

function buildSearchPanel(q,re,unitFilter){
  srPanel.innerHTML='';
  if(!q)return;
  var results=[];
  D.forEach(function(unit){
    var uid='u'+unit.unit;
    if(unitFilter!=='all'&&unitFilter!==uid)return;
    unit.tasks.forEach(function(t){
      var fieldsTxt=(t.fields||[]).map(function(f){return f[0]+' '+f[1];}).join(' ');
      var stepsTxt=(t.steps||[]).join(' ').replace(/<[^>]+>/g,' ');
      var txt=[unit.title,unit.sc||'',t.title,t.app||'',fieldsTxt,stepsTxt,t.warn||'',t.info||'',t.result||''].join(' ');
      if(txt.toLowerCase().indexOf(q)>=0)results.push({unit:unit,task:t,uid:uid});
    });
  });
  if(!results.length)return;
  var bar=document.createElement('div');bar.className='sr-bar';
  bar.innerHTML='<span class="sr-count"><b>'+results.length+'</b> soru bulundu</span><button class="sr-close" onclick="clearSearch()">✕ Aramayı Temizle</button>';
  srPanel.appendChild(bar);
  var COLORS={1:'#06b6d4',2:'#a855f7',3:'#60a5fa',4:'#f59e0b',5:'#22c55e',6:'#ef4444',7:'#fbbf24',8:'#34d399',9:'#818cf8'};
  results.forEach(function(r){
    var t=r.task,u=r.unit;var c=COLORS[u.unit]||'#60a5fa';
    var div=document.createElement('div');div.className='sr-card';
    var bc='<div class="sr-bc"><span class="sr-unit" style="color:'+c+';border-color:'+c+'40;background:'+c+'12">'+hlStr(u.title,re)+'</span><span class="sr-sep">›</span><span class="sr-tn">'+t.num+'</span></div>';
    var th='<div class="sr-th"><span class="sr-tt">'+hlStr(t.title,re)+'</span>'+(t.app?'<span class="sr-ab cpy" onclick="copyVal(this)" data-cpy="'+cpyAttr(t.app)+'">'+hlStr(t.app,re)+'</span>':'')+'</div>';
    var ph='';
    if(t.path&&t.path.length){ph='<div class="sr-path">'+t.path.map(function(p,i){return'<span class="sr-pc">'+hlStr(p,re)+'</span>'+(i<t.path.length-1?'<span class="sr-pa">›</span>':'');}).join('')+'</div>';}
    var fh='';
    if(t.fields&&t.fields.length){var rows=t.fields.map(function(f){if(f[0].startsWith('──'))return'<tr class="fvt-sec"><td colspan="2">'+f[0]+'</td></tr>';return'<tr><td>'+hlStr(f[0],re)+'</td><td class="cpy" onclick="copyVal(this)" data-cpy="'+cpyAttr(f[1])+'">'+hlStr(f[1],re)+'</td></tr>';}).join('');fh='<div class="fvt-wrap"><table class="fvt"><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>'+rows+'</tbody></table></div>';}
    var sh='';
    if(t.steps&&t.steps.length){var sn=0;sh='<ol class="sl">'+t.steps.map(function(s){if(typeof s==='string'&&s.charAt(0)==='§'){sn=0;return'<li class="sgrp"><span class="stx">'+hlStr(s.slice(1),re)+'</span></li>';}sn++;return'<li><span class="snum">'+sn+'</span><span class="stx">'+hlStr(s,re)+'</span></li>';}).join('')+'</ol>';}
    div.innerHTML=bc+th+ph+(t.warn?'<div class="box warn"><span class="bi">⚠</span><div>'+hlStr(t.warn,re)+'</div></div>':'')+(t.info?'<div class="box info"><span class="bi">ℹ</span><div>'+hlStr(t.info,re)+'</div></div>':'')+fh+sh+(t.result?'<div class="box result"><span class="bi">✓</span><div>'+hlStr(t.result,re)+'</div></div>':'');
    srPanel.appendChild(div);
  });
}

function enrichSteps(root){
  if(!root)return;
  root.querySelectorAll('.stx b:not(.cptok):not(.enr)').forEach(function(b){
    b.classList.add('enr');
    var term=b.textContent.trim();
    if(term.indexOf('→')>=0){b.classList.add('nowrap');return;}
    if(NOCPY_TOKENS.has(term))return;
    if(/\b(gün|yıl|ay|hafta)\b/i.test(term))return;
    var isNamed=NAMED_VALUES.has(term);
    var isCode=/^[A-Z0-9][A-Z0-9_\-\/\.# ]*$/.test(term) && /[0-9#]/.test(term);
    var isNum=/^[\d.,]+/.test(term) || /\bEUR\b/.test(term) || /\b(PC|HR|AU|H)$/.test(term);
    var isShort=/^[A-Z]$/.test(term) || /^[A-Z]{2,5}$/.test(term);
    var isApp=/^(Create|Manage|Post|Display|Monitor|Process|Print|Supplier|My|Enter) /.test(term);
    if(isNamed||isCode||isNum||isShort||isApp){
      b.classList.add('cptok');
      b.setAttribute('data-cpy',b.textContent);
      b.setAttribute('onclick','copyVal(this)');
    }
  });
}

    document.getElementById('nores').style.display='none';
    document.getElementById('xpb').style.display='none';
    buildSearchPanel(q,re,activeU);
    srPanel.style.display='block';enrichSteps(srPanel);
    var cnt=srPanel.querySelectorAll('.sr-card').length;
    document.getElementById('cnt').textContent=String(cnt);
    if(!cnt){srPanel.style.display='none';document.getElementById('nores').style.display='block';}
  }else{
    document.getElementById('app').style.display='';
    srPanel.style.display='none';srPanel.innerHTML='';
    document.getElementById('nores').style.display='none';
    document.getElementById('xpb').style.display='';
    var shown=0;
    document.querySelectorAll('.ug').forEach(function(ug){
      var badge=ug.querySelector('.ubadge');
      var uNum=badge?badge.textContent.replace(/[^0-9]/g,''):'';
      var ok=(activeU==='all'||activeU===('u'+uNum)||activeU===uNum);
      ug.classList.toggle('hid',!ok);
      if(ok){shown+=ug.querySelectorAll('.task').length;}
    });
    document.getElementById('cnt').textContent=String(shown);
  }
}
var activeU='all',expanded=false;
var app=document.getElementById('app');
var frow=document.getElementById('frow');
D.forEach(function(u){
  app.insertAdjacentHTML('beforeend',unit(u));
  var b=document.createElement('button');b.className='fb';b.dataset.u='u'+u.unit;
  var name=(u.title.split(' · ')[1]||u.title);name=name.length>22?name.slice(0,22)+'…':name;
  b.textContent='T'+u.unit+': '+name;
  frow.appendChild(b);
});
frow.addEventListener('click',function(e){var b=e.target.closest('.fb');if(!b)return;activeU=b.dataset.u;document.querySelectorAll('.fb').forEach(function(x){x.classList.remove('on');});b.classList.add('on');run();});
document.getElementById('search').addEventListener('input',run);
document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Escape')clearSearch();});
document.getElementById('clr').addEventListener('click',clearSearch);
document.getElementById('xpb').addEventListener('click',function(){
  expanded=!expanded;
  document.querySelectorAll('.ug:not(.hid)').forEach(function(u){u.classList.toggle('collapsed',!expanded);});
  document.querySelectorAll('.ug:not(.hid) .task').forEach(function(t){t.classList.toggle('open',expanded);});
  document.getElementById('xpb').textContent=expanded?'Tümünü Kapat':'Tümünü Aç';
  document.getElementById('xpb').classList.toggle('active',expanded);
});
run();
enrichSteps(document.getElementById('app'));
</script>
